name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - run: cp lib/main.dart /tmp/main.dart
      - run: rm -rf android
      - run: cd /tmp && flutter create --template app --platforms android --project-name guardadito guardadito_temp
      - run: cp -r /tmp/guardadito_temp/android.
      - run: cp /tmp/main.dart lib/main.dart
      - run: sed -i "s/1.7.10/1.9.22/g; s/1.7.1/1.9.22/g; s/1.8.10/1.9.22/g" android/app/build.gradle
      - run: sed -i "s/1.7.10/1.9.22/g; s/1.8.22/1.9.22/g" android/settings.gradle
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: guardadito-apk
          path: build/app/outputs/flutter-apk/app-release.apk

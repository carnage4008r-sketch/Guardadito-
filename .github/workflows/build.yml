name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: cp lib/main.dart /tmp/main.dart
      - run: cp pubspec.yaml /tmp/pubspec.yaml
      - run: rm -rf android
      - run: cd /tmp && flutter create --template app --platforms android guardadito_temp
      - run: cp -r /tmp/guardadito_temp/android .
      - run: cp /tmp/main.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: guardadito-apk
          path: build/app/outputs/flutter-apk/app-release.apk
